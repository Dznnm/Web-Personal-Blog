<!DOCTYPE html>
<html>
    <head>
        <title>Vale's Blog</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <div class="container">
        <h1>Vale's Lifeprint</h1>
        <hr>
        <div class="articles">
            {% for article in articles %}
                <div class="article">
                    <a href="{{ url_for('article', article_id=article.id) }}">
                        {{ article.title }}
                    </a>
                    <small>{{ article.date }}</small>
                </div>
            {% endfor %}
        </div>
        </div>
    </body>
