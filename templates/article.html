<!DOCTYPE html>
<html>
    <head>
        <title>{{ article.title }} - Vale's Blog</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <div class="container">
        <h1>{{ article.title }}</h1>
        <small>{{ article.date }}</small> <a href="{{ url_for('edit_article', article_id=article.id) }}">Edit</a>
        <form method="POST" action="{{ url_for('edit_article', article_id=article.id) }}">
            <input type="submit" name="action" value="Delete Article">
        </form>
        <p>{{ article.content }}</p>
        </div>
    </body>
</html>
