<!DOCTYPE html>
<html>
    <head>
        <title>Vale's Blog</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    </head>
    <body>
        <div class="container">
        <nav>
            <a href="{{ url_for('add_article') }}">Add Article</a>
        </nav>
        <h1>Vale's Lifeprint</h1>
        <div class="articles">
            {% for article in articles %}
                <div class="article">
                    <a href="{{ url_for('articled', article_id=article.id) }}">
                        {{ article.title }}
                    </a>
                    <small>{{ article.date }}</small>
                </div>
                    <div class="ED">
                        <a href="{{ url_for('edit_article', article_id=article.id) }}">Edit</a>
                        <form method="POST" action="{{ url_for('edit_article', article_id=article.id) }}">
                        <input type="submit" name="action" value="Delete Article">
                        </form>
        </div>
                
            {% endfor %}
        </div>
        </div>
    </body>
